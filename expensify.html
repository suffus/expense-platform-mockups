<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expensify — Northwind Labs (mockup)</title>
<style>
:root {
  --green: #03d47c;
  --green-ink: #002e22;
  --navy: #0c1b33;
  --navy-2: #e8eaed;
  --ink: #0c1b33;
  --muted: #5c6b80;
  --line: #e4e8ee;
  --bg: #f6f6f4;
  --card: #fff;
  --warn: #c47b00;
  --warn-bg: #fff6e0;
  --bad: #d0423a;
  --bad-bg: #fdecea;
  --ok: #0a8a52;
  --ok-bg: #e7f8ef;
  --blue: #0185ff;
  --rail: 80px;
  --sans: "Expensify Neue", Inter, ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: #f6f6f4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

.review {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 8px 14px; background: #111827; color: #e5e7eb; font-size: 12px;
  border-bottom: 1px solid #1f2937;
}
.review strong { color: var(--green); font-weight: 650; }
.review a { color: #93c5fd; }
.seg { display: inline-flex; border: 1px solid #374151; border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; color: #9ca3af; border: 0; padding: 5px 10px; }
.seg button[aria-pressed="true"] { background: #1f2937; color: #fff; }
.review .grow { margin-inline-start: auto; color: #9ca3af; }

.app { display: flex; height: calc(100vh - 41px); background: #fff; color: var(--ink); }
.app.mobile { max-width: 390px; margin: 12px auto; height: calc(100vh - 65px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }

.rail {
  width: var(--rail); background: #fff; color: #8b959e; border-right: 1px solid #f0f0ee;
  display: flex; flex-direction: column; align-items: center; padding: 10px 0 14px; gap: 2px;
}
.logo {
  width: 40px; height: 40px; border-radius: 12px; background: var(--green); color: var(--green-ink);
  display: grid; place-items: center; font-weight: 800; margin-bottom: 8px; border: 0;
}
.rail button.nav {
  width: 64px; min-height: 52px; border: 0; background: transparent; color: inherit;
  border-radius: 12px; display: grid; place-items: center; gap: 2px; padding: 6px 0;
}
.rail button.nav svg { width: 22px; height: 22px; }
.rail button.nav span { font-size: 11px; font-weight: 650; }
.rail button.nav[aria-current="page"] { color: var(--green-ink); }
.rail button.nav[aria-current="page"] svg { stroke: var(--green); }
.rail button.plus { margin-top: 6px; background: var(--green); color: var(--green-ink); border-radius: 50%; width: 40px; height: 40px; border: 0; font-size: 22px; line-height: 1; }
.rail .spacer { flex: 1; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; border: 0; font-weight: 700; font-size: 12px; color: #fff;
}
.search-btn { margin-inline-start: auto; border: 0; background: transparent; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.search-btn:hover { background: var(--bg); }

.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top {
  height: 52px; background: #fff; border-bottom: 0;
  display: flex; align-items: center; gap: 12px; padding: 0 24px;
}
.top h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -0.02em; }
.search {
  margin-inline-start: auto; display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; min-width: 220px;
}
.search input { border: 0; background: transparent; outline: none; width: 100%; }
.main { flex: 1; overflow: auto; padding: 8px 28px 48px; background: #f6f6f4; }
.main.pad0 { padding: 0; overflow: hidden; display: flex; }

.card { background: var(--card); border: 0; border-radius: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.money { font-variant-numeric: tabular-nums; font-weight: 650; }
h2 { font-size: 15px; margin: 0; }
.grid { display: grid; gap: 16px; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.kpi { padding: 16px 18px; }
.kpi .lbl { font-size: 12px; color: var(--muted); }
.kpi .val { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-top: 4px; }

.todo { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; }
.todo:last-child { border-bottom: 0; }
.todo:hover { background: #f7fafc; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-top: 6px; flex: none; }
.dot.warn { background: #f5b942; }
.dot.bad { background: var(--bad); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 20px; border: 1px solid transparent; padding: 8px 14px; font-weight: 650; font-size: 13px; background: transparent;
}
.btn.green { background: var(--green); color: var(--green-ink); }
.btn.navy { background: var(--navy); color: #fff; }
.btn.ghost { border-color: var(--line); background: #fff; }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 650;
  background: var(--bg); border: 1px solid var(--line);
}
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.info { background: #e8f3ff; color: #0b63c2; border-color: transparent; }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 650; padding: 10px 12px; border-bottom: 1px solid var(--line); }
table.data td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover { background: #f7fafc; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.merchant { font-weight: 650; }
.sub { color: var(--muted); font-size: 12px; }

.split { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
.listpane { background: #fff; border-right: 1px solid #f0f0ee; overflow: auto; }
.listitem { display: flex; gap: 12px; padding: 12px 16px; width: 100%; text-align: left; background: transparent; border: 0; align-items: flex-start; }
.listitem[aria-current="true"] { background: #f0f0ee; }
.listitem:hover { background: #f6f6f4; }
.thread { display: flex; flex-direction: column; min-width: 0; background: #fff; }
.thread-h { padding: 14px 20px; background: #fff; border-bottom: 1px solid #f0f0ee; }
.msgs { flex: 1; overflow: auto; padding: 20px; display: grid; gap: 10px; align-content: start; background: #fff; }
.bubble { max-width: 72%; background: #f6f6f4; border: 0; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.bubble.me { margin-inline-start: auto; background: var(--green); color: var(--green-ink); }
.bubble.me .tiny { color: #064e3b; }
.preview { background: #f6f6f4; border: 0; border-radius: 16px; padding: 14px; }
.composer { display: flex; gap: 8px; padding: 12px 16px 16px; background: #fff; }
.composer input { flex: 1; border: 0; background: #f6f6f4; border-radius: 20px; padding: 10px 16px; }
.composer .btn.green { border-radius: 50%; width: 40px; height: 40px; padding: 0; }

.bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding: 8px 4px 0; }
.bars i { flex: 1; background: var(--green); border-radius: 6px 6px 2px 2px; display: block; min-height: 8px; opacity: 0.85; }
.bars span { display: block; text-align: center; font-size: 10px; color: var(--muted); margin-top: 4px; }

.overlay { position: fixed; inset: 0; background: rgb(12 27 51 / 0.45); display: grid; place-items: center; padding: 16px; z-index: 40; }
.dialog { background: #fff; border-radius: 18px; width: min(100%, 520px); max-height: calc(100vh - 40px); overflow: auto; padding: 20px; }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 12px; font-weight: 650; }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff;
}
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--green); font-weight: 650; }

.receipt {
  height: 180px; border: 1px dashed #c5d0e0; border-radius: 12px; background:
    repeating-linear-gradient(45deg, #f7fafc, #f7fafc 8px, #eef2f6 8px, #eef2f6 16px);
  display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 12px;
}
.receipt.ok { border-style: solid; background: #fff; color: var(--ink); }
.side2 { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 16px; align-items: start; }
.ws-nav { display: flex; flex-direction: column; gap: 2px; }
.ws-nav button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; color: var(--muted); }
.ws-nav button[aria-current="true"] { background: #e9fbf3; color: var(--ink); font-weight: 650; }

.menu {
  position: absolute; inset-inline-start: 8px; inset-block-end: 52px; background: #fff; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 24px rgb(12 27 51 / 0.12); padding: 6px; min-width: 200px; z-index: 20;
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; }
.menu button:hover { background: var(--bg); }
.rel { position: relative; }
.sw { display: inline-flex; width: 36px; height: 20px; border-radius: 99px; background: var(--green); position: relative; vertical-align: middle; }
.sw::after { content: ""; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; right: 2px; }
.sw.off { background: #c5c9ce; }
.sw.off::after { right: auto; left: 2px; }
.rule { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rule .lbl { font-weight: 650; }
.payopt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.payopt:hover { border-color: var(--green); }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .side2 { grid-template-columns: 1fr; }
  .search { min-width: 0; width: 140px; }
}
.app.mobile .rail span { display: none; }
.app.mobile .rail button.nav { height: 42px; }
.app.mobile .main { padding: 14px; }
.app.mobile .split { grid-template-columns: 1fr; }
</style>
</head>

<div class="review">

</div>

<script>

  function fmt(d) {

  function draftReportsFor(user) {
    return S.data.reports.filter(function (r) { return r.user === user && r.status === 'draft'; });
  }
  function targetReportId() {
    var cur = S.data.reports.find(function (x) { return x.id === S.selectedReport; });
    if (S.view === 'report' && cur && cur.user === S.role && cur.status === 'draft') return cur.id;
    var drafts = draftReportsFor(S.role);
    return drafts.length ? drafts[0].id : '';
  }
  function recountReport(id) {
    var r = S.data.reports.find(function (x) { return x.id === id; });
    if (!r) return;
    r.total = S.data.expenses.filter(function (e) { return e.report === id; }).reduce(function (s, e) { return s + e.amount; }, 0);
    r.violations = S.data.expenses.filter(function (e) { return e.report === id && e.violation; }).length;
  }
  function saveExpense(fields) {
    var exp = {
      id: 'e' + Date.now(),
      merchant: fields.merchant,
      date: fields.date || '2026-11-25',
      amount: +fields.amount,
      currency: 'USD',
      category: fields.category || '',
      tag: fields.tag || '',
      user: S.role,
      receipt: !!fields.receipt,
      report: fields.report || null
    };
    S.data.expenses.unshift(exp);
    if (exp.report) recountReport(exp.report);
    return exp;
  }

    if (kind === 'report') {

  function act(name, id) {
    if (name === 'bulkpay') {
      var ready = S.data.reports.filter(function (x) { return x.status === 'approved' && !x.paid; });
      if (!ready.length) { toast('Nothing ready to pay'); return; }
      openPay(ready); return;
    }
    if (name === 'export') { toast('Queued QuickBooks export'); render(); return; }
    if (name === 'attach') {
      var exp = S.data.expenses.find(function (x) { return x.id === id; });
      var dest = S.selectedReport;
      if (exp && dest) {
        exp.report = dest;
        recountReport(dest);
        toast('Added to report');
      }
      render();
      return;
    }
    var r = S.data.reports.find(function (x) { return x.id === id; });
    if (!r) return;
    if (name === 'approve') { r.status = 'approved'; r.violations = 0; toast('Approved ' + r.name); }
    if (name === 'reject') { r.status = 'draft'; toast('Sent back to ' + person(r.user).name); }
    if (name === 'submit') {
      recountReport(r.id);
      if (!S.data.expenses.some(function (e) { return e.report === r.id; })) { toast('Add at least one expense before submitting'); return; }
      r.status = 'submitted'; r.submitted = '2026-11-25'; toast('Submitted to ' + person(r.to).name);
    }
    if (name === 'pay') { openPay([r]); return; }
    render();
  }

  function openPay(reports) {
    var total = reports.reduce(function (s, r) { return s + r.total; }, 0);
    var who = reports.length === 1 ? person(reports[0].user).name : reports.length + ' reports';
    var bank = S.data.banks[reports[0].user] || S.data.banks.maya;
    $('modal').innerHTML = '<div class="overlay"><div class="dialog"><h2>Pay ' + who + '</h2><p class="tiny muted">Total ' + money(total) + '. Workspace reimbursements debit Checking ••1190.</p>' +
      '<button class="payopt" data-payhow="ach"><strong>ACH to personal bank</strong><div class="sub">' + bank.bank + ' ••' + bank.last4 + ' · 1–2 business days</div></button>' +
      '<button class="payopt" data-payhow="wallet"><strong>Expensify Wallet</strong><div class="sub">Instant to the member’s Wallet, then they cash out</div></button>' +
      '<button class="payopt" data-payhow="outside"><strong>Pay outside Expensify</strong><div class="sub">Mark reimbursed for a payroll or check run. Nothing leaves this bank feed.</div></button>' +
      '<button class="btn ghost" type="button" id="cx" style="margin-top:8px">Cancel</button></div></div>';
    $('cx').onclick = function () { $('modal').innerHTML = ''; };
    document.querySelectorAll('[data-payhow]').forEach(function (b) {
      b.addEventListener('click', function () {
        var how = b.getAttribute('data-payhow');
        reports.forEach(function (r) { r.paid = true; r.status = 'paid'; r.payHow = how; });
        $('modal').innerHTML = '';
        toast(how === 'outside' ? 'Marked paid outside Expensify' : (how === 'wallet' ? 'Paid via Wallet' : 'ACH reimbursement sent'));
        render();
      });
    });
  }

  function render() {
    renderChrome();
    var main = $('main');
    main.className = 'main' + (S.view === 'inbox' ? ' pad0' : '');
    var html = {
      home: renderHome,
      inbox: renderInbox,
      reports: renderReports,
      report: renderReport,
      spend: renderSpend,
      expense: renderExpense,
      wallet: renderWallet,
      insights: function () {
        var spend = [4.2, 6.1, 5.4, 8.9, 7.2, 4.8];
        var months = ['Jun','Jul','Aug','Sep','Oct','Nov'];
        return '<div class="grid"><div class="card" style="padding:16px"><h2>Spend over time</h2><p class="tiny muted">Northwind Labs · last 6 months</p><div class="bars" style="margin-top:12px">' + spend.map(function (n, i) { return '<div style="flex:1"><i style="height:' + (n / 9 * 100) + '%"></i><span>' + months[i] + '</span></div>'; }).join('') + '</div></div>' +
          '<div class="card" style="padding:16px"><h2>Top categories</h2><p class="tiny">Software $1,300 · Training $890 · Lodging $312 · Travel $690</p></div>' +
          '<div class="card" style="padding:16px"><h2>Top merchants</h2><p class="tiny">Amazon Web Services · Web Summit · Kimpton De Witt</p></div>' +
          '<div class="card" style="padding:16px"><h2>Top spenders</h2><p class="tiny">Alex Rivera · Maya Chen</p></div></div>';
      },
      account: renderAccount,
      workspace: renderWorkspace,
      invoices: function () { return renderSimpleList('Invoices', S.data.invoices.map(function (i) { return '<div class="spread" style="padding:12px 16px;border-top:1px solid var(--line)"><div><div class="merchant">' + i.customer + '</div><div class="sub">' + i.status + (i.due ? ' · due ' + fmt(i.due) : '') + '</div></div><div class="money">' + money(i.amount) + '</div></div>'; }).join('')); },
      trips: function () { return renderSimpleList('Trips', S.data.trips.map(function (t) { return '<div class="spread" style="padding:12px 16px;border-top:1px solid var(--line)"><div><div class="merchant">' + t.name + '</div><div class="sub">' + person(t.user).name + ' · ' + t.city + ' · ' + fmt(t.start) + '–' + fmt(t.end) + '</div></div><span class="chip">' + t.status + '</span></div>'; }).join('')); }
    }[S.view];
    main.innerHTML = html ? html() : '<p>Unknown view</p>';
    main.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-nav')); }); });
    main.querySelectorAll('[data-rep]').forEach(function (b) { b.addEventListener('click', function () { go('report', { selectedReport: b.getAttribute('data-rep') }); }); });
    main.querySelectorAll('[data-exp]').forEach(function (b) { b.addEventListener('click', function () { go('expense', { selectedExpense: b.getAttribute('data-exp') }); }); });
    main.querySelectorAll('[data-chat]').forEach(function (b) { b.addEventListener('click', function () { go('inbox', { selectedChat: b.getAttribute('data-chat') }); }); });
    main.querySelectorAll('[data-spend]').forEach(function (b) { b.addEventListener('click', function () { S.spendType = b.getAttribute('data-spend'); render(); }); });
    main.querySelectorAll('[data-ws]').forEach(function (b) { b.addEventListener('click', function () { S.wsTab = b.getAttribute('data-ws'); render(); }); });
    main.querySelectorAll('[data-ruletab]').forEach(function (b) { b.addEventListener('click', function () { S.wsRuleTab = b.getAttribute('data-ruletab'); render(); }); });
    main.querySelectorAll('[data-sfilter]').forEach(function (b) { b.addEventListener('click', function () { S.spendFilter = b.getAttribute('data-sfilter'); S.spendType = 'Expense Report'; go('spend'); }); });
    main.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); act(b.getAttribute('data-act'), b.getAttribute('data-id')); }); });
    main.querySelectorAll('[data-create]').forEach(function (b) { b.addEventListener('click', function () { openCreate(b.getAttribute('data-create')); }); });
    var form = $('chatForm');
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = form.m.value.trim();
      if (!v) return;
      S.data.messages.r1.push({ who: S.role, text: v });
      render();
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') $('modal').innerHTML = '';
  });
  render();
})();
</script>
</body>
</html>
